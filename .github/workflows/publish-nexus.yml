# =============================================================================
#  Publish a release to Nexus Mods
# -----------------------------------------------------------------------------
#  Publishing a GitHub release is the go signal. This job takes the .7z attached
#  to that release and adds it to the Nexus mod page as a new version of an
#  existing file, through Nexus's own upload action (their v3 upload API).
#
#  WHAT HAS TO BE SET UP ONCE, BY HAND
#    1. The mod page has to exist on Nexus already, with at least one file on it.
#       The upload API adds a *version* to an existing file -- it cannot create a
#       mod page, and it cannot create the first file.
#    2. Repository secret  NEXUSMODS_API_KEY  -- a personal key from
#       https://www.nexusmods.com/settings/api-keys
#    3. Repository variable NEXUS_FILE_ID  -- the id of the file to add versions
#       to. Files tab of the public mod page -> "API Info", or the edit menu on
#       Manage Files.
#    4. Repository variable NEXUS_MOD_ID  -- optional, and only needed to post the
#       changelog entry. It is the mod's internal id, not the number in the page
#       URL: GET https://api.nexusmods.com/v3/games/zerosievert/mods/<page number>
#       and read the "id" field.
#
#  Until 2 and 3 are present the job skips with a notice rather than failing, so
#  this can sit in the repo before the Nexus page is ready.
#
#  The file description and the changelog entry are both taken from the release's
#  own section of CHANGELOG.md, which is the single changelog this project keeps.
#  Because that file is Markdown for GitHub and Nexus renders neither Markdown nor
#  its 80-column hard wrapping, the notes step below unwraps it and strips the
#  markup before sending it.
# =============================================================================

name: Publish to Nexus Mods

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 1.1.1. Defaults to the latest release."
        required: false
      changelog_only:
        description: "Add this version's changelog without uploading or changing a file."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  nexus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if   [ -n "${INPUT_VERSION:-}" ]; then VERSION="${INPUT_VERSION#v}"
          elif [ -n "${TAG:-}" ];           then VERSION="${TAG#v}"
          else VERSION="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"; VERSION="${VERSION#v}"
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::could not work out which version to publish"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download the release archive
        if: ${{ !inputs.changelog_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "v${{ steps.ver.outputs.version }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "ZoneCompanions-${{ steps.ver.outputs.version }}.7z" \
            --dir dist
          ls -la dist

      - name: Check the Nexus wiring
        id: cfg
        env:
          NEXUS_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          FILE_ID: ${{ vars.NEXUS_FILE_ID }}
          MOD_ID: ${{ vars.NEXUS_MOD_ID }}
          CHANGELOG_ONLY: ${{ inputs.changelog_only }}
        run: |
          set -euo pipefail
          MISSING=""
          [ -z "${NEXUS_KEY:-}" ] && MISSING="the NEXUSMODS_API_KEY secret"
          if [ "${CHANGELOG_ONLY:-false}" = "true" ]; then
            [ -z "${MOD_ID:-}" ] && MISSING="${MISSING:+$MISSING and }the NEXUS_MOD_ID variable"
          else
            [ -z "${FILE_ID:-}" ] && MISSING="${MISSING:+$MISSING and }the NEXUS_FILE_ID variable"
          fi
          if [ -n "$MISSING" ]; then
            echo "::notice::Nexus publication skipped -- still missing $MISSING."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Lift the release notes out of CHANGELOG.md
        id: notes
        if: ${{ steps.cfg.outputs.configured == 'true' }}
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          BLOCK="$(python3 - "$VERSION" <<'PY'
          import re, sys

          ver = sys.argv[1]
          lines = open("CHANGELOG.md", encoding="utf-8").read().splitlines()

          start = None
          for i, ln in enumerate(lines):
              if ln.startswith("## [" + ver + "]"):
                  start = i + 1
                  break
          if start is None:
              sys.exit(0)          # no such release -> empty output -> warning below

          # Pass 1: take the section, drop horizontal rules and link definitions, and
          # unwrap the hard-wrapped Markdown so every bullet or paragraph is one line.
          # Nexus renders newlines literally, so leaving the 80-column wrapping in
          # would ragged-edge the whole description.
          rows = []
          for ln in lines[start:]:
              if ln.startswith("## "):
                  break
              ln = ln.rstrip()
              if ln.strip() in ("", "---") or re.match(r"^\[[^\]]+\]:\s", ln):
                  if rows and rows[-1] != "":
                      rows.append("")
                  continue
              if ln.startswith("#"):
                  rows.append(ln.lstrip("# ").strip())
                  continue
              stripped = ln.lstrip()
              indent = len(ln) - len(stripped)
              if stripped.startswith("- "):
                  rows.append(" " * indent + stripped)
              elif rows and rows[-1] != "":
                  rows[-1] = rows[-1].rstrip() + " " + stripped
              else:
                  rows.append(stripped)

          # Pass 2: strip the Markdown, now that no construct spans a line break.
          def demd(s):
              s = s.replace("\\*", "\0")                                  # A\* -> A*
              s = re.sub(r"`([^`]*)`", r"\1", s)
              s = re.sub(r"\*\*([^*]+)\*\*", r"\1", s)
              s = re.sub(r"\[([^\]]+)\]\((https?://[^)]+)\)", r"\1 (\2)", s)
              s = re.sub(r"\[([^\]]+)\]\([^)]+\)", r"\1", s)
              s = re.sub(r"\*([^*]+)\*", r"\1", s)
              return s.replace("\0", "*")

          print("\n".join(demd(r) for r in rows).strip())
          PY
          )"
          if [ -z "$BLOCK" ]; then
            echo "::warning::no '## [$VERSION]' section in CHANGELOG.md -- uploading without a description"
          fi
          {
            echo "text<<CSQ_NOTES_EOF"
            echo "$BLOCK"
            echo "CSQ_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # A one-off historical release may need its notes backfilled after its file
      # has already been published. Do that directly through the same v3 endpoint
      # the upload action uses, instead of creating a duplicate file version.
      - name: Add a changelog-only entry
        if: ${{ steps.cfg.outputs.configured == 'true' && inputs.changelog_only }}
        env:
          NEXUS_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          MOD_ID: ${{ vars.NEXUS_MOD_ID }}
          VERSION: ${{ steps.ver.outputs.version }}
          CHANGELOG: ${{ steps.notes.outputs.text }}
        run: |
          set -euo pipefail
          if [ -z "$CHANGELOG" ]; then
            echo "::error::no CHANGELOG.md section for $VERSION"
            exit 1
          fi
          curl --fail-with-body --show-error --request POST \
            --header "apikey: $NEXUS_KEY" \
            --header "Content-Type: application/json" \
            --header "User-Agent: ZoneCompanions-publish-workflow" \
            --data "$(jq -cn --arg version "$VERSION" --arg changelog "$CHANGELOG" '{version: $version, changelog: $changelog}')" \
            "https://api.nexusmods.com/v3/mods/$MOD_ID/changelogs"

      # Pinned to a tag rather than a moving ref: this is a beta action and the
      # upload API it talks to is itself in open beta.
      #
      # archive_existing_version keeps the page tidy -- the previous version moves
      # to old files instead of sitting alongside the new one. update_mod_version
      # makes the page's version number follow the release. changelog is only sent
      # when NEXUS_MOD_ID is set, because the API rejects one without it.
      - name: Upload to Nexus Mods
        if: ${{ steps.cfg.outputs.configured == 'true' && !inputs.changelog_only }}
        uses: Nexus-Mods/upload-action@c96019556046053aa26044b44396cd38929daf23 # v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUS_FILE_ID }}
          filename: dist/ZoneCompanions-${{ steps.ver.outputs.version }}.7z
          version: ${{ steps.ver.outputs.version }}
          display_name: Zone Companions ${{ steps.ver.outputs.version }}
          description: ${{ steps.notes.outputs.text }}
          category: main
          archive_existing_version: true
          update_mod_version: true
          mod_id: ${{ vars.NEXUS_MOD_ID }}
          changelog: ${{ vars.NEXUS_MOD_ID && steps.notes.outputs.text || '' }}
